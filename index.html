<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZX6R Rev Limiter Dashboard</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background:#111; color:#fff; }
    h1 { font-size: 24px; color: #0f0; }
    button { font-size: 18px; padding: 10px 20px; margin:10px; }
    label { display:block; margin: 10px 0; }
    input[type=range] { width: 80%; }
    .value { font-weight:bold; color:#0f0; font-size:20px; }
    #rpm { font-size: 32px; color:#ff0; margin-top:20px; }
    #status { margin-top:10px; font-weight:bold; }
  </style>
</head>
<body>
  <h1>ZX6R Rev Limiter</h1>
  <button onclick="connectBLE()">Connect Bluetooth</button>
  <p id="status">Disconnected</p>

  <label>Rev Limit: <span id="revVal" class="value">15000 RPM</span>
    <input type="range" id="revLimit" min="8000" max="16000" value="15000">
  </label>

  <label>Soft Zone: <span id="softVal" class="value">800 RPM</span>
    <input type="range" id="softZone" min="200" max="1500" value="800">
  </label>

  <p>RPM: <span id="rpm">0</span></p>

<script>
let bleDevice, bleServer, bleChar;

async function connectBLE() {
  try {
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'BT05' }],
      optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
    });
    bleServer = await bleDevice.gatt.connect();
    const service = await bleServer.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
    bleChar = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
    document.getElementById('status').innerText = 'Connected';

    await bleChar.startNotifications();
    bleChar.addEventListener('characteristicvaluechanged', handleNotifications);
  } catch(e) {
    console.error(e);
    document.getElementById('status').innerText = 'Error: ' + e;
  }
}

function handleNotifications(event) {
  const value = new TextDecoder().decode(event.target.value);
  if(value.startsWith('rpm=')) {
    document.getElementById('rpm').innerText = value.slice(4);
  }
}

// Send limit / soft updates
const revSlider = document.getElementById('revLimit');
const softSlider = document.getElementById('softZone');

revSlider.addEventListener('input', (e) => {
  document.getElementById('revVal').innerText = e.target.value + ' RPM';
  if(bleChar) bleChar.writeValue(new TextEncoder().encode('limit=' + e.target.value + '\n'));
});

softSlider.addEventListener('input', (e) => {
  document.getElementById('softVal').innerText = e.target.value + ' RPM';
  if(bleChar) bleChar.writeValue(new TextEncoder().encode('soft=' + e.target.value + '\n'));
});
</script>
</body>
</html>
